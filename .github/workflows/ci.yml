name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apcore-toolkit-typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: apcore-toolkit-typescript

      - name: Checkout canonical conformance fixtures
        uses: actions/checkout@v4
        with:
          repository: aiperceivable/apcore-toolkit
          ref: main
          path: apcore-toolkit

      - name: Verify binding-structure fixture
        run: |
          if [ ! -s ../apcore-toolkit/conformance/fixtures/binding_structure.json ]; then
            echo "::error::Publish the binding-structure fixture to apcore-toolkit main before merging this SDK change."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the 1.3 line the packaging smoke test was validated against;
          # `latest` would let a bun release turn CI red without a code change.
          bun-version: 1.3.x

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm --ignore-workspace install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # Guards the regression that shipped in 0.14.1: `VERSION` resolved
      # ../package.json through createRequire(import.meta.url), which cannot work
      # inside a `bun --compile` single-file binary ($bunfs).
      - name: Packaging smoke test (compiled consumer)
        run: APCORE_PACKAGING_TEST=1 pnpm test tests/packaging.test.ts
